<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chores -- Family Chore Play</title>
</head>
<body>
  <h1>Chores</h1>
  <p><a href="{% url 'chore_create' %}">Create a chore</a></p>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Points</th>
        <th>Ownership</th>
        <th>Verification</th>
        <th>Active</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for chore in chores %}
        <tr>
          <td>{{ chore.name }}</td>
          <td>{{ chore.points }}</td>
          <td>{{ chore.get_ownership_type_display }}</td>
          <td>{{ chore.get_verification_mode_display }}</td>
          <td>{{ chore.is_active|yesno:"Yes,No" }}</td>
          <td><a href="{% url 'chore_edit' chore.pk %}">Edit</a></td>
        </tr>
      {% empty %}
        <tr><td colspan="6">No chores yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
